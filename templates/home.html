{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% block content %}
<h2>Our Products</h2>
<div class="cards">
{% for product in products %}
    <div class="card">
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p>Price: ₹{{ product.price }}</p>
        <a href="{% url 'add_to_cart' product.id %}"><button>Add to Cart</button></a>
    </div>
{% endfor %}
</div>
{% endblock %}
